<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Stackly | Charity &amp; Non-Profit</title>
  <meta name="description" content="Lost? This page wandered off to help someone. Every path from here leads somewhere good — head home or explore our verified causes.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e3b2e">
  <meta property="og:title" content="Stackly — Page Not Found">
  <meta property="og:description" content="This page wandered off to help someone. Head home or explore our verified causes.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/webp" href="images/logo.webp">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f0a833' d='M12 21c-4.9-3.6-8.5-6.9-8.5-10.8C3.5 6.9 6 4.7 8.7 4.7c1.4 0 2.6.7 3.3 1.8.7-1.1 1.9-1.8 3.3-1.8 2.7 0 5.2 2.2 5.2 5.5 0 3.9-3.6 7.2-8.5 10.8z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main id="main">
    <section class="hero-404">
      <div class="hero-bg" aria-hidden="true">
        <span class="blob blob-emerald"></span>
        <span class="blob blob-gold"></span>
        <span class="dot-grid"></span>
      </div>

      <a class="error-brand" href="index.html" aria-label="Stackly — back to home">
        <img src="images/logo.webp" alt="Stackly" width="107" height="44">
      </a>

      <div class="container hero-404-inner">
        <div class="code-404" aria-hidden="true">
          <span class="digit">4</span>
          <span class="digit digit-heart"><i class="bi bi-heart-fill"></i></span>
          <span class="digit">4</span>
          <div class="rotating-badge">
            <svg viewBox="0 0 120 120">
              <defs>
                <path id="badgeCircle" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"></path>
              </defs>
              <text><textPath href="#badgeCircle" startOffset="0">PAGE NOT FOUND • GIVE WITH HEART • </textPath></text>
            </svg>
            <i class="bi bi-compass"></i>
          </div>
        </div>

        <h1 class="title-404" id="error-title">This page wandered off <em>to help someone</em></h1>
        <p class="sub-404">The link may be broken, but every path from here still leads somewhere that matters.</p>

        <div class="actions-404">
          <a href="index.html" class="btn btn-accent btn-lg">Take me home <i class="bi bi-house-heart-fill" aria-hidden="true"></i></a>
          <button type="button" class="btn btn-ghost-light btn-lg" data-history-back>
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Go Back
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      "use strict";
      if (typeof window.gsap === "undefined") return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const tl = gsap.timeline({ defaults: { ease: "power4.out" } });
      tl.from(".code-404 .digit", { yPercent: 55, scale: 0.62, autoAlpha: 0, duration: 1, ease: "back.out(1.7)", stagger: 0.15 })
        .from(".hero-404 .rotating-badge", { scale: 0, autoAlpha: 0, duration: 0.8, ease: "back.out(1.9)" }, "-=0.5")
        .from(".title-404", { y: 32, autoAlpha: 0, duration: 0.8 }, "-=0.55")
        .from(".sub-404", { y: 26, autoAlpha: 0, duration: 0.75 }, "-=0.6")
        .from(".actions-404 > *", { y: 24, autoAlpha: 0, duration: 0.6, stagger: 0.12 }, "-=0.5");

      gsap.to(".code-404 .digit", {
        y: -10,
        duration: 2.8,
        ease: "sine.inOut",
        yoyo: true,
        repeat: -1,
        stagger: 0.45,
        delay: 2,
      });

      const ring = document.querySelector(".hero-404 .rotating-badge svg");
      if (ring) gsap.to(ring, { rotation: 360, duration: 18, ease: "none", repeat: -1 });

      gsap.to(".hero-404 .blob-emerald", { y: -34, duration: 5.5, ease: "sine.inOut", yoyo: true, repeat: -1 });
      gsap.to(".hero-404 .blob-gold", { y: 30, duration: 6.5, ease: "sine.inOut", yoyo: true, repeat: -1 });
    })();
  </script>
  <script>
    (() => {
      const backButton = document.querySelector("[data-history-back]");
      if (backButton) backButton.addEventListener("click", () => window.history.back());
    })();
  </script>
</body>
</html>
